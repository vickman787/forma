name: forma
x-app: &app
  image: forma:local
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  restart: unless-stopped
  env_file:
    - ${FORMA_ENV_DIR:-../.forma/deploy}/shared.env
  volumes:
    - private_data:/data
  read_only: true
  tmpfs:
    - /tmp:size=512m,mode=1777
    - /home/node/.cache:size=64m,mode=0700,uid=1000,gid=1000
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}
  depends_on:
    db: {condition: service_healthy}
services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: forma
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
    secrets: [db_password, db_admin_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-forma-role.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d forma"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  web:
    <<: *app
    environment: {PROCESS_ROLE: web}
    ports: ["127.0.0.1:${FORMA_WEB_PORT:-3000}:3000"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
  generation:
    <<: *app
    environment: {PROCESS_ROLE: generation}
    env_file:
      - ${FORMA_ENV_DIR:-../.forma/deploy}/shared.env
      - ${FORMA_ENV_DIR:-../.forma/deploy}/generation.env
    command: [node, --import, tsx, worker/index.ts]
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: [CMD, node, --import, tsx, scripts/worker-healthcheck.ts, generation]
      interval: 20s
      timeout: 5s
      retries: 3
  chain:
    <<: *app
    environment: {PROCESS_ROLE: chain}
    command: [node, --import, tsx, worker/chain.ts]
    healthcheck:
      test: [CMD, node, --import, tsx, scripts/worker-healthcheck.ts, chain]
      interval: 20s
      timeout: 5s
      retries: 3
  operator:
    <<: *app
    profiles: [operator]
    environment: {PROCESS_ROLE: operator}
    env_file:
      - ${FORMA_ENV_DIR:-../.forma/deploy}/shared.env
      - ${FORMA_ENV_DIR:-../.forma/deploy}/operator.env
    command: [node, --import, tsx, worker/operator.ts]
    healthcheck:
      test: [CMD, node, --import, tsx, scripts/worker-healthcheck.ts, operator]
      interval: 20s
      timeout: 5s
      retries: 3
  preview:
    <<: *app
    environment: {PROCESS_ROLE: preview}
    command: [node, --import, tsx, worker/preview.ts]
    ports: ["127.0.0.1:${FORMA_PREVIEW_PORT:-4317}:4317"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4317/').then(r=>process.exit(r.status===404?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
volumes:
  postgres_data:
  private_data:
secrets:
  db_password:
    file: ${FORMA_ENV_DIR:-../.forma/deploy}/db-password
  db_admin_password:
    file: ${FORMA_ENV_DIR:-../.forma/deploy}/db-admin-password
